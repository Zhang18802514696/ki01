<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>50关地狱极致坑爹大冒险｜纯按钮闯关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}
:root{
    --bg-main:#121222;
    --bg-card:#191938;
    --bg-level:#202048;
    --color-text:#ffffff;
    --color-primary:#00e5ee;
    --color-danger:#ff2233;
    --color-warning:#ffdd00;
}
.theme-blue{
    --bg-main:#091b2d;
    --bg-card:#102a44;
    --bg-level:#14385a;
}
.theme-red{
    --bg-main:#2b0505;
    --bg-card:#420909;
    --bg-level:#570e0e;
}
.theme-pink{
    --bg-main:#301426;
    --bg-card:#451c37;
    --bg-level:#5c254a;
}
.theme-green{
    --bg-main:#072214;
    --bg-card:#0d3520;
    --bg-level:#13492c;
}
.theme-gray{
    --bg-main:#1f1f1f;
    --bg-card:#2f2f2f;
    --bg-level:#3f3f3f;
}
body{
    background:var(--bg-main);
    color:var(--color-text);
    min-height:100vh;
    padding:12px;
    transition: background 0.4s ease;
    user-select:none;
}
.container{
    max-width:880px;
    margin:0 auto;
}
.top-bar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}
h1{
    color:var(--color-danger);
    text-shadow:0 0 10px var(--color-danger);
    font-size:22px;
    cursor:pointer;
}
.tool-group{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}
.info-panel{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(130px,1fr));
    gap:10px;
    background:var(--bg-card);
    padding:12px 16px;
    border-radius:10px;
    margin-bottom:16px;
}
.info-item{
    text-align:center;
}
.level-box{
    background:var(--bg-level);
    padding:40px 20px;
    border-radius:12px;
    min-height:450px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}
.tip{
    font-size:18px;
    margin:20px 0;
    line-height:1.8;
    text-align:center;
}
.btn{
    padding:13px 24px;
    margin:12px;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
    transition:0.15s ease;
}
.btn-normal{background:var(--color-primary);color:#000;}
.btn-danger{background:var(--color-danger);color:#fff;}
.btn-warning{background:var(--color-warning);color:#000;}
.btn-sm{padding:6px 10px;font-size:13px;}
.hidden{display:none !important;}
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:15px;
}
.modal-content{
    background:var(--bg-card);
    padding:32px 28px;
    border-radius:12px;
    max-width:550px;
    width:100%;
    text-align:center;
}
.theme-select{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:10px 0;
}
.theme-btn{
    width:28px;height:28px;border-radius:50%;border:2px solid #fff;cursor:pointer;
}
.leaderboard{
    margin:15px 0;
    text-align:left;
    background:rgba(255,255,255,0.07);
    padding:12px;
    border-radius:8px;
}
.invisible-btn{
    background:transparent;
    border:none;
    position:absolute;
}
.blink{
    animation:blink 0.6s infinite;
}
@keyframes blink{
    0%,100%{opacity:1}
    50%{opacity:0.1}
}
.fake-progress{
    width:80%;
    height:12px;
    background:#333;
    border-radius:6px;
    margin:15px auto;
    overflow:hidden;
}
.fake-bar{
    height:100%;
    width:75%;
    background:#00e5ee;
}
.admin-input{
    padding:10px;
    width:60%;
    font-size:16px;
    margin:15px 0;
    border-radius:6px;
    border:none;
    text-align:center;
}
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <h1 id="mainTitle">😈50关地狱极致坑爹大冒险</h1>
        <div class="tool-group">
            <button class="btn btn-sm btn-normal" id="bgmToggle">背景音乐开</button>
            <button class="btn btn-sm btn-normal" id="soundToggle">音效开</button>
            <button class="btn btn-sm btn-danger" id="resetBtn">重置本次闯关</button>
        </div>
    </div>

    <div class="theme-select">
        <span>切换主题：</span>
        <div class="theme-btn" style="background:#121222" data-theme="default" title="经典暗黑"></div>
        <div class="theme-btn" style="background:#091b2d" data-theme="theme-blue" title="深海蓝"></div>
        <div class="theme-btn" style="background:#2b0505" data-theme="theme-red" title="炼狱红"></div>
        <div class="theme-btn" style="background:#301426" data-theme="theme-pink" title="暗系粉"></div>
        <div class="theme-btn" style="background:#072214" data-theme="theme-green" title="森林绿"></div>
        <div class="theme-btn" style="background:#1f1f1f" data-theme="theme-gray" title="极简灰"></div>
    </div>

    <div class="info-panel">
        <div class="info-item">当前关卡：<span id="currentLevel">1</span>/50</div>
        <div class="info-item">本局失败：<span id="failCount">0</span></div>
        <div class="info-item">历史最高：<span id="bestRecord">0</span>关</div>
        <div class="info-item">总翻车次数：<span id="totalFailRecord">0</span></div>
    </div>

    <div class="leaderboard">
        <h3>📊本地闯关排行榜</h3>
        <div id="rankText">暂无闯关记录，开始你的折磨之旅吧！</div>
    </div>

    <div class="level-box" id="levelBox">
        <p class="tip" id="levelTip"></p>
        <div id="btnGroup"></div>
    </div>

    <!--普通弹窗-->
    <div class="modal hidden" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle"></h2>
            <p id="modalText" style="margin:22px 0;line-height:1.8"></p>
            <button class="btn btn-normal" id="modalBtn">确定</button>
        </div>
    </div>

    <!--管理员弹窗-->
    <div class="modal hidden" id="adminModal">
        <div class="modal-content">
            <h2>🔧 管理员模式 - 跳关面板</h2>
            <p>请输入要跳转的关卡(1-50)</p>
            <input type="number" min="1" max="50" class="admin-input" id="jumpInput" placeholder="输入关卡数字">
            <div>
                <button class="btn btn-normal" id="confirmJump">确认跳关</button>
                <button class="btn btn-warning" id="jumpTo50">直达50关</button>
                <button class="btn btn-danger" id="resetFail">清空本局失败次数</button>
                <button class="btn btn-normal" id="closeAdmin">关闭</button>
            </div>
        </div>
    </div>
</div>

<audio id="bgmAudio" loop preload="auto">
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">

<audio id="clickAudio" preload="auto">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3" type="audio/mpeg">

<audio id="winAudio" preload="auto">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3" type="audio/mpeg">

<audio id="loseAudio" preload="auto">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-player-losing-or-failing-2042.mp3" type="audio/mpeg">

<script>
let currentLevel = 1;
let failCount = 0;
const MAX_LEVEL = 50;
let bgmOn = true;
let soundOn = true;
const bgmAudio = document.getElementById('bgmAudio');
const clickAudio = document.getElementById('clickAudio');
const winAudio = document.getElementById('winAudio');
const loseAudio = document.getElementById('loseAudio');

//管理员：无点击间隔，连续点10次开启
let titleClickCount = 0;
const ADMIN_NEED_CLICK = 10;

const adminModal = document.getElementById('adminModal');
const jumpInput = document.getElementById('jumpInput');
const confirmJumpBtn = document.getElementById('confirmJump');
const jump50Btn = document.getElementById('jumpTo50');
const resetFailBtn = document.getElementById('resetFail');
const closeAdminBtn = document.getElementById('closeAdmin');

function openAdminPanel(){
    adminModal.classList.remove('hidden');
    jumpInput.value = currentLevel;
}
function closeAdminPanel(){
    adminModal.classList.add('hidden');
}

confirmJumpBtn.onclick = function(){
    const target = parseInt(jumpInput.value);
    if(!isNaN(target) && target >= 1 && target <= MAX_LEVEL){
        currentLevel = target;
        closeAdminPanel();
        renderLevel();
        playAudio(winAudio);
        alert(`已成功跳转到第${target}关`);
    }else{
        alert('请输入1-50之间的有效关卡数字');
    }
};

jump50Btn.onclick = function(){
    currentLevel = 50;
    closeAdminPanel();
    renderLevel();
    playAudio(winAudio);
    alert('已一键直达第50关终极地狱关卡');
};

resetFailBtn.onclick = function(){
    failCount = 0;
    document.getElementById('failCount').textContent = failCount;
    playAudio(winAudio);
    alert('本局失败次数已清空');
};

closeAdminBtn.onclick = closeAdminPanel;

const mainTitle = document.getElementById('mainTitle');
mainTitle.addEventListener('click', function(){
    titleClickCount++;
    if(titleClickCount >= ADMIN_NEED_CLICK){
        titleClickCount = 0;
        openAdminPanel();
    }
});

function getRankData(){
    let data = localStorage.getItem('hellKdGame');
    return data ? JSON.parse(data) : {best:0,totalFail:0,records:[]};
}
function saveRankData(obj){
    localStorage.setItem('hellKdGame',JSON.stringify(obj));
}
let rankData = getRankData();
document.getElementById('bestRecord').textContent = rankData.best;
document.getElementById('totalFailRecord').textContent = rankData.totalFail;

function renderRank(){
    const wrap = document.getElementById('rankText');
    if(rankData.records.length===0){
        wrap.innerHTML = '暂无闯关记录，每一关都会狠狠折磨你！';
        return;
    }
    let html = '<ol>';
    rankData.records.slice(-12).reverse().forEach(item=>{
        html += `<li>闯至第${item.level}关｜本局翻车${item.fail}次</li>`;
    })
    html += '</ol>';
    wrap.innerHTML = html;
}
renderRank();

document.querySelectorAll('.theme-btn').forEach(btn=>{
    btn.onclick = ()=>{
        document.body.className = btn.dataset.theme === 'default' ? '' : btn.dataset.theme;
    }
})

document.getElementById('bgmToggle').onclick = function(){
    bgmOn = !bgmOn;
    this.textContent = bgmOn ? '背景音乐开' : '背景音乐关';
    bgmOn ? bgmAudio.play().catch(()=>{}) : bgmAudio.pause();
}
document.getElementById('soundToggle').onclick = function(){
    soundOn = !soundOn;
    this.textContent = soundOn ? '音效开' : '音效关';
}
function playAudio(audioDom){
    if(!soundOn) return;
    audioDom.currentTime = 0;
    audioDom.play().catch(()=>{});
}

document.getElementById('resetBtn').onclick = ()=>{
    if(confirm('重置本局进度，历史排行榜不会清空，确定继续？')){
        currentLevel = 1;
        failCount = 0;
        renderLevel();
    }
}

function renderLevel(){
    const data = levelConfig[currentLevel-1];
    levelShow.textContent = currentLevel;
    failShow.textContent = failCount;
    levelTip.innerText = data.tip;
    btnGroup.innerHTML = '';

    data.btns.forEach(item=>{
        const btn = document.createElement('button');
        btn.className = `btn ${item.c}`;
        btn.innerHTML = item.t;
        if(item.s) btn.style.cssText = item.s;
        btn.addEventListener('click',()=>{
            playAudio(clickAudio);
            if(!item.ok){
                failCount++;
                playAudio(loseAudio);
                showModal('挑战失败','');
                modalBtn.onclick = function(){
                    modal.classList.add('hidden');
                    renderLevel();
                }
            }else{
                playAudio(winAudio);
                showModal('闯关成功','');
                modalBtn.onclick = function(){
                    modal.classList.add('hidden');
                    nextLevel();
                }
            }
        })
        if(data.doubleClickFail){
            btn.addEventListener('dblclick',()=>{
                playAudio(loseAudio);
                failCount++;
                showModal('挑战失败','');
                modalBtn.onclick = function(){
                    modal.classList.add('hidden');
                    renderLevel();
                }
            })
        }
        btnGroup.appendChild(btn);
    })
}

function showModal(title,text){
    modalTitle.textContent = title;
    modalText.textContent = text;
    modal.classList.remove('hidden');
}

function nextLevel(){
    rankData.records.push({level:currentLevel,fail:failCount});
    rankData.totalFail = failCount;
    if(currentLevel>rankData.best) rankData.best = currentLevel;
    saveRankData(rankData);
    document.getElementById('bestRecord').textContent = rankData.best;
    document.getElementById('totalFailRecord').textContent = rankData.totalFail;
    renderRank();

    if(currentLevel < MAX_LEVEL){
        currentLevel++;
        renderLevel();
    }else{
        showModal('🏆全部通关','');
    }
}

window.addEventListener('click',()=>{
    if(bgmOn && bgmAudio.paused){
        bgmAudio.play().catch(()=>{});
    }
},{once:true})

renderLevel();
